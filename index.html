            {

                options: ["仁答 (Rentap)", "拿督巴当·阿邦·阿都拉 (Datu Patinggi Abang Abdul Gapor)", "督查曼", "末沙里"],
                answer: 1,
                explain: "他们两人联手保护泗里街 (Sarikei) 和古晋周围地区的权力和主权。"
            },
            {
                q: "这些地方领袖的抗争给后代带来的最大启示是什么？",
                options: ["爱国主义与不屈不挠的精神", "应当盲目服从外来势力", "为了金钱而放弃土地", "回避所有冲突"],
                answer: 0,
                explain: "先烈们视死如归捍卫家园的精神，启发了后代珍惜国家独立与主权。"
            },
            {
                q: "彭亨抗英英雄中，与拿督巴哈曼 (Dato' Bahaman) 并肩作战的著名勇士是：",
                options: ["督高雅 (Tok Gajah) 和 玛吉拉 (Mat Kilau)", "拿督马哈拉惹里拉", "昂哥休", "多赛益"],
                answer: 0,
                explain: "督高雅 (Tok Gajah) 及其儿子玛吉拉 (Mat Kilau) 是彭亨反抗英国殖民的重要英雄。"
            },
            {
                q: "英国人之所以能够最终镇压大多数地方抗争，主要原因是：",
                options: ["英军拥有现代化的先进武器及分而治之的策略", "地方英雄没有勇气", "当地人民支持英国人", "当地没有森林可守"],
                answer: 0,
                explain: "英国人利用了火器优势以及分割地方力量的“分而治之”策略镇压了起义。"

        // State Variables
        let currentQuizIndex = 0;
        let score = 0;
        let studentInfo = { name: '', email: '' };

        // DOM elements
        const loginCard = document.getElementById('login-card');
        const quizCard = document.getElementById('quiz-card');
        const resultCard = document.getElementById('result-card');
        const teacherModal = document.getElementById('teacher-modal');

        // Form Submit
        function startQuiz(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const email = document.getElementById('student-email').value.trim().toLowerCase();
            const emailError = document.getElementById('email-error');

            if (!email.endsWith('@moe-dl.edu.my')) {
                emailError.classList.remove('hidden');
                return;
            }
            emailError.classList.add('hidden');

            studentInfo = { name, email };
            document.getElementById('student-display-name').innerText = `学生: ${name} (${email})`;

            loginCard.classList.add('hidden');
            quizCard.classList.remove('hidden');

            currentQuizIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const data = quizData[currentQuizIndex];
            document.getElementById('question-number').innerText = `第 ${currentQuizIndex + 1} / ${quizData.length} 题`;
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            data.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-200 bg-white hover:border-indigo-500 font-medium text-gray-700 transition flex items-center justify-between";
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span> <i class="fa-regular fa-circle text-gray-300"></i>`;
                btn.onclick = () => checkAnswer(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const data = quizData[currentQuizIndex];
            const options = document.querySelectorAll('.option-btn');
            
            options.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            if (selectedIndex === data.answer) {
                score += Math.round(100 / quizData.length);
                options[selectedIndex].classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                options[selectedIndex].querySelector('i').className = "fa-solid fa-circle-check text-emerald-500";
                
                expBox.className = "p-4 rounded-xl mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800";
                expTitle.innerHTML = `<i class="fa-solid fa-circle-check"></i> 回答正确！`;
            } else {
                options[selectedIndex].classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                options[selectedIndex].querySelector('i').className = "fa-solid fa-circle-xmark text-red-500";

                options[data.answer].classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                
                expBox.className = "p-4 rounded-xl mb-6 bg-red-50 border border-red-200 text-red-800";
                expTitle.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 回答错误`;
            }

            expText.innerText = data.explain;
            expBox.classList.remove('hidden');
            document.getElementById('score-live').innerText = `得分: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < quizData.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / 100`;

            const payload = {
                name: studentInfo.name,
                email: studentInfo.email,
                score: score,
                timestamp: new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Kuala_Lumpur' })
            };

            // Save to Firestore Cloud
            if (db) {
                db.collection("quiz_results").add(payload)
                .then(() => console.log("Saved to cloud!"))
                .catch(err => console.error("Error saving cloud:", err));
            }

            // Local fallback
            let localData = JSON.parse(localStorage.getItem('history_quiz_results') || '[]');
            localData.push(payload);
            localStorage.setItem('history_quiz_results', JSON.stringify(localData));
        }

        // Teacher Area Modal
        function openTeacherModal() {
            teacherModal.classList.remove('hidden');
        }
        function closeTeacherModal() {
            teacherModal.classList.add('hidden');
        }

        function authTeacher() {
            const pwd = document.getElementById('teacher-password').value;
            if (pwd === '2020Hui%%') {
                document.getElementById('teacher-auth-form').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                document.getElementById('auth-error').classList.add('hidden');
                fetchResults();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function fetchResults() {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">数据加载中...</td></tr>';

            if (db) {
                db.collection("quiz_results").orderBy("timestamp", "desc").get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">暂无学生提交成绩</td></tr>';
                        return;
                    }
                    tbody.innerHTML = '';
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="p-3 font-semibold text-gray-800">${data.name}</td>
                                <td class="p-3 text-gray-500">${data.email}</td>
                                <td class="p-3 font-bold text-indigo-600">${data.score} 分</td>
                                <td class="p-3 text-xs text-gray-400">${data.timestamp}</td>
                            </tr>
                        `;
                    });
                })
                .catch((err) => {
                    console.error("Fetch error:", err);
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">连接云端失败，已切换至本地视图</td></tr>';
                });
            }
        }

        function exportToCSV() {
            if (!db) return;
            db.collection("quiz_results").get().then(snapshot => {
                let csv = '学生姓名,MOE 邮箱,得分,提交时间\n';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    csv += `"${d.name}","${d.email}","${d.score}","${d.timestamp}"\n`;
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `5年级历史练习成绩汇总_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            });
        }

        function clearAllDataConfirm() {
            if (confirm("确定要清空数据库中所有学生的答题记录吗？此操作无法撤销！")) {
                if (db) {
                    db.collection("quiz_results").get().then(snapshot => {
                        snapshot.forEach(doc => doc.ref.delete());
                        alert("数据库已清空！");
                        fetchResults();
                    });
                }
            }
        }
    </script>
</body>
</html>
